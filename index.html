  <body>
    <!-- Persistent Native HTML5 Audio Tag for guaranteed mobile & desktop playback -->
    <audio id="rk-bg-audio" src="/Tenu-Sang-Rakhna-trimmed.mp3" loop preload="auto" playsinline webkit-playsinline></audio>

    <div id="root"></div>

    <script>
      (function() {
        function startAudio() {
          var el = document.getElementById('rk-bg-audio');
          if (el) {
            el.volume = 0.75;
            var p = el.play();
            if (p && typeof p.then === 'function') {
              p.then(function() {
                removeTriggers();
              }).catch(function() {});
            }
          }
        }

        function removeTriggers() {
          ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'scroll'].forEach(function(ev) {
            window.removeEventListener(ev, startAudio, true);
            document.removeEventListener(ev, startAudio, true);
          });
        }

        ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown', 'scroll'].forEach(function(ev) {
          window.addEventListener(ev, startAudio, { capture: true, passive: true });
          document.addEventListener(ev, startAudio, { capture: true, passive: true });
        });

        document.addEventListener('DOMContentLoaded', startAudio);
        window.addEventListener('load', startAudio);
        startAudio();
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
